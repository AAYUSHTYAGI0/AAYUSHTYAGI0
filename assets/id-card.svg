<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Aayush Tyagi developer ID card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#150a30"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2b52"/><stop offset="1" stop-color="#2b1560"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cc"><rect x="90" y="70" width="240" height="340" rx="18"/></clipPath>
    <clipPath id="pc"><rect x="140" y="126" width="140" height="140" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
    .drop{animation:drop 1.7s both}
    @keyframes drop{
      0%{transform:translateY(-540px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
      52%{transform:translateY(0);animation-timing-function:cubic-bezier(0,.5,.5,1)}
      66%{transform:translateY(-38px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
      78%{transform:translateY(0);animation-timing-function:cubic-bezier(0,.5,.5,1)}
      87%{transform:translateY(-10px);animation-timing-function:cubic-bezier(.5,0,1,.6)}
      100%{transform:translateY(0)}}
    .swing{transform-origin:210px 0;animation:swing 6s ease-in-out 1.5s infinite}
    @keyframes swing{0%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
    .turn{transform-origin:210px 240px;animation:turn 6s ease-in-out 1.5s infinite}
    @keyframes turn{0%,50%,100%{transform:scaleX(1) skewY(0)}25%{transform:scaleX(.94) skewY(-1.5deg)}75%{transform:scaleX(.94) skewY(1.5deg)}}
    .shine{animation:shine 5s linear 2s infinite}
    @keyframes shine{0%{transform:translateX(0)}60%,100%{transform:translateX(520px)}}
    .d{opacity:0;animation:slide .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes slide{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .f{animation:float 7s ease-in-out infinite alternate}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-22px)}}
  </style>

  <rect width="900" height="440" rx="20" fill="url(#bg)"/>
  <rect width="900" height="440" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="210" cy="240" r="190" fill="#22d3ee" opacity=".06"/>
  <circle cx="760" cy="120" r="130" fill="#a78bfa" opacity=".07"/>
  <g fill="#a5f3fc">
    <circle class="f" cx="60" cy="90" r="2" opacity=".6"/>
    <circle class="f" cx="380" cy="60" r="2.5" opacity=".5" style="animation-delay:-2s"/>
    <circle class="f" cx="880" cy="250" r="2" opacity=".6" style="animation-delay:-4s"/>
    <circle class="f" cx="400" cy="400" r="2" opacity=".5" style="animation-delay:-1s"/>
    <circle class="f" cx="30" cy="330" r="2.5" opacity=".5" style="animation-delay:-5s"/>
    <circle class="f" cx="660" cy="40" r="2" opacity=".6" style="animation-delay:-3s"/>
  </g>

  <!-- Falling lanyard + card -->
  <g class="drop"><g class="swing">
    <rect x="198" y="-700" width="24" height="772" fill="url(#acc)"/>
    <line x1="210" y1="-700" x2="210" y2="70" stroke="#0b1020" stroke-opacity=".35" stroke-dasharray="6 6"/>
    <g class="turn">
      <rect x="90" y="70" width="240" height="340" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity=".18"/>
      <g clip-path="url(#cc)">
        <rect x="90" y="70" width="240" height="44" fill="url(#acc)"/>
        <g transform="skewX(-20)"><rect class="shine" x="100" y="60" width="70" height="360" fill="url(#shineG)"/></g>
      </g>
      <text x="210" y="98" font-size="12" font-weight="700" letter-spacing="4" fill="#0b1020" text-anchor="middle">DEVELOPER ID</text>
      <rect x="188" y="56" width="44" height="22" rx="6" fill="#cbd5e1"/>
      <rect x="203" y="63" width="14" height="8" rx="4" fill="#0b1020"/>

      <rect x="140" y="126" width="140" height="140" rx="14" fill="#0f172a" stroke="url(#acc)" stroke-width="2"/>
      <text x="210" y="212" font-size="52" font-weight="800" fill="url(#acc)" text-anchor="middle">AT</text>
      <!-- PHOTO: PHOTO_DATA_URI gets replaced by your base64 photo (see README steps) -->
      <image href="PHOTO_DATA_URI" x="140" y="126" width="140" height="140" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc)"/>

      <text x="210" y="297" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="1">AAYUSH TYAGI</text>
      <text x="210" y="317" font-size="12" fill="#22d3ee" text-anchor="middle">App &amp; Web Developer</text>
      <text x="210" y="335" font-size="11" fill="#94a3b8" text-anchor="middle">B.Tech CSE · AI/ML</text>
      <line x1="120" y1="364" x2="300" y2="364" stroke="#fff" stroke-opacity=".85" stroke-width="26" stroke-dasharray="2 3 1 2 4 2 1 3 2 2 3 1 4 2 1 2"/>
      <text x="210" y="402" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="3">@AAYUSHTYAGI00</text>
    </g>
  </g></g>

  <!-- Details slide in from the right -->
  <g class="d" style="animation-delay:1.6s"><circle class="pulse" cx="438" cy="96" r="5" fill="#22c55e"/><text x="452" y="101" font-size="13" fill="#22c55e" letter-spacing="2">OPEN TO COLLABORATE</text></g>
  <g class="d" style="animation-delay:1.8s"><text x="430" y="158" font-size="16" fill="#94a3b8" letter-spacing="3">HELLO WORLD, I'M</text></g>
  <g class="d" style="animation-delay:2s"><text x="428" y="214" font-size="58" font-weight="800" fill="url(#acc)">Aayush Tyagi</text></g>
  <g class="d" style="animation-delay:2.2s"><text x="430" y="250" font-size="22" fill="#e2e8f0">App &amp; Web Developer · AI/ML</text></g>
  <g class="d" style="animation-delay:2.4s"><text x="430" y="278" font-size="15" fill="#94a3b8">B.Tech CSE (AI/ML) · Lovely Professional University</text></g>
  <g class="d" style="animation-delay:2.6s">
    <rect x="430" y="298" width="420" height="2" fill="url(#acc)" opacity=".5"/>
    <text x="430" y="326" font-size="13" fill="#94a3b8" letter-spacing="2">BUILDS</text>
    <text x="500" y="326" font-size="15" fill="#e2e8f0">AURA · ExpertEdge · MEMORY AI · VaultMind</text>
  </g>
  <g class="d" style="animation-delay:2.8s" font-size="13" fill="#e2e8f0" text-anchor="middle">
    <g fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2">
      <rect x="430" y="344" width="60" height="28" rx="14"/><rect x="500" y="344" width="110" height="28" rx="14"/>
      <rect x="620" y="344" width="86" height="28" rx="14"/><rect x="716" y="344" width="74" height="28" rx="14"/>
      <rect x="800" y="344" width="70" height="28" rx="14"/>
    </g>
    <text x="460" y="363">React</text><text x="555" y="363">React Native</text><text x="663" y="363">Supabase</text><text x="753" y="363">Gemini</text><text x="835" y="363">Claude</text>
  </g>
  <g class="d" style="animation-delay:3s"><text x="430" y="408" font-size="13" fill="#64748b">github.com/aayushtyagi00</text></g>
</svg>
